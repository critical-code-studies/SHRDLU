  <title>SHRDLU Research Bench</title>
  <meta name="description" content="A working bench for the critical reading of the SHRDLU source code: read, compare, trace the versions, annotate and export.">
  <meta property="og:title" content="SHRDLU Research Bench">
  <meta property="og:description" content="Read, compare and annotate the surviving MacLisp and Micro-Planner source of Terry Winograd's SHRDLU (MIT, 1968–72), with the Critical Code Studies group.">

  <meta property="og:url" content="https://critical-code-studies.github.io/SHRDLU/research/">

  <!-- Bench version: the ?v= on every script and stylesheet below. Raise it by
       0.0.1 on every push that changes research/, all tags alike, so browsers
       fetch fresh copies. kit/base.js reads it from its own tag. Set bench-date to
       the day of the release; the About box (kit/about.js) shows both. -->
  <meta name="bench-date" content="2026-10-11">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=3">

<body>
  <header class="bar">
    <a class="brand" href="./" title="SHRDLU Research Bench">
      <svg viewBox="0 0 32 32" aria-hidden="true" class="brand-cube" width="26" height="26"><g fill="none" stroke="#3aa862" stroke-width="1.6" stroke-linejoin="round"><path d="M16 4 L27 10 L16 16 L5 10 Z"/><path d="M27 10 L27 21 M16 16 L16 27 M5 10 L5 21"/><path d="M5 21 L16 27 L27 21"/></g></svg>
      <span class="brand-name"><img class="brand-mark" src="../assets/wordmark.svg" alt="SHRDLU" width="58" height="16"><b>research bench</b></span>
      <span class="bench-ver" id="bench-ver"></span>
    </a>
    <label class="pick">
      <span>Version</span>
      <select id="pick-a" aria-label="Version"></select>
      <span class="swref" id="vref" title="The bench’s reference to this source (Help ▸ Referencing and versions)"></span>
      <span class="vlang" id="vlang" title="The language this version is written in"></span>
    </label>
        <div class="bar-right">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <span class="size-btns"><button class="icon-btn" id="btn-smaller" title="Smaller code text">A−</button><button class="icon-btn" id="btn-larger" title="Larger code text">A+</button></span>
      <button class="icon-btn" id="btn-theme" title="Switch between your last light and dark colour themes (choose themes in ⚙ Settings)">◐</button>
      <button class="icon-btn" id="btn-code" title="Go to a code: an annotation (A-, R-), a finding (C-, F), a note (initials-N)">#</button>
      <button class="icon-btn news-btn" id="btn-news" title="What’s new in the group’s annotations">✉<span class="news-n" id="news-n"></span></button>
      <!-- About is in the Help menu; this hidden button carries its handler -->
      <button class="icon-btn" id="btn-about" hidden>ⓘ</button>
      <button class="icon-btn" id="btn-settings" title="Your initials and the Hypothesis group, colour theme, code font and size">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="read" class="on">Read</button>
    <button data-tab="run" title="Run SHRDLU in the browser, from a version’s own source: type to it, or play the 1970 dialogue as a test">Run</button>
    <button data-menu="text" data-tabs="analyse" aria-expanded="false" title="The source as text: comments, hands and dates, names, histories">Text <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="program" data-tabs="analyse" aria-expanded="false" title="The program: its parts, calls, Micro-Planner theorems, the dictionary">Program <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="versions" data-tabs="about compare genealogy analyse" aria-expanded="false" title="The version open, comparison, genealogy, gaps in the record">Versions <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="graphics" data-tabs="graphics" aria-expanded="false" title="The blocks world and the machinery that draws and moves it">Graphics <span class="caret" aria-hidden="true">▾</span></button>
    <button data-tab="findings" title="What the bench and the group have established, with evidence; shared">Findings</button>
    <button data-tab="notes" title="What you have gathered for writing: figures, excerpts, findings, paragraphs; private, in this browser">My notes</button>
    <button data-tab="paratexts" title="The scans, clippings, photographs and documents around the program, shared with the crew">Paratexts</button>
    <button data-menu="help" aria-expanded="false" title="About the bench, settings, the code">Help <span class="caret" aria-hidden="true">▾</span></button>
    <a class="tabs-map" href="sitemap.html" title="Every view and version as a plain link, for when a menu will not open">Site map</a>
  </nav>
  <noscript><div class="noscript">The research bench runs in JavaScript, which is turned off in this browser. The <a href="sitemap.html">site map</a> lists every version with its source files, which open on GitHub without it.</div></noscript>

  <main id="main">

    <section class="view" id="view-paratexts"></section>
  </main>
